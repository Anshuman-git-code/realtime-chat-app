services:
  backend:
    build: .
    container_name: chat-backend
    expose:
      - "8000"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: chat-nginx
    ports:
      - "80:80"
    volumes:
      # Mount static frontend files into the NGINX document root (read-only)
      - ./frontend:/usr/share/nginx/html:ro
      # Mount custom NGINX configuration to enable reverse proxy and WebSocket routing (read-only)
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: always
