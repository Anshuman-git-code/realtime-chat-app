name: Chat Application Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  verify-runner:
    # Fixed: Divert workflow scheduling path to leverage the self-hosted AWS runner
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Runner Information
        run: |
          echo "Current Execution User Identity:"
          whoami

          echo ""

          echo "Current Engine Working Directory:"
          pwd

          echo ""

          echo "Repository Directory Trace Log:"
          ls -la
