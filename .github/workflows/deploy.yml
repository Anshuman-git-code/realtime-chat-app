name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          cd /home/ubuntu/realtime-chat-app
          git pull
          docker-compose up -d --build

      - name: Verify Deployment
        run: |
          docker ps